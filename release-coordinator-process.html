<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Interactive design diagram for the proposed 6529 Release Coordinator."
    />
    <title>6529 Release Coordinator — Process Diagram</title>
    <style>
      :root {
        color-scheme: dark;
        --page: #080b11;
        --surface: #10151e;
        --surface-strong: #151c27;
        --surface-soft: #0c1119;
        --line: #293242;
        --line-strong: #3a475b;
        --text: #f3f6fb;
        --muted: #9aa8ba;
        --blue: #64a8ff;
        --blue-soft: rgba(100, 168, 255, 0.12);
        --green: #58d6a1;
        --green-soft: rgba(88, 214, 161, 0.12);
        --orange: #ffad5b;
        --orange-soft: rgba(255, 173, 91, 0.12);
        --red: #ff7e87;
        --red-soft: rgba(255, 126, 135, 0.12);
        --shadow: 0 22px 70px rgba(0, 0, 0, 0.3);
        --radius: 16px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: var(--page);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        line-height: 1.55;
      }

      button,
      a {
        font: inherit;
      }

      a {
        color: var(--blue);
      }

      .page-shell {
        width: min(1800px, calc(100% - 32px));
        margin: 0 auto;
        padding: 20px 0 40px;
      }

      h2,
      h3,
      p {
        margin-top: 0;
      }

      .diagram-context {
        margin: 0 0 14px 2px;
        color: var(--muted);
        font-size: 12px;
      }

      .flow-layout {
        display: grid;
        grid-template-columns: minmax(460px, 0.95fr) minmax(430px, 1.05fr);
        gap: 24px;
        align-items: start;
        margin-top: 0;
      }

      .flow-column,
      .detail-column {
        min-width: 0;
      }

      .steps {
        display: grid;
        gap: 0;
      }

      .step-wrap {
        position: relative;
        padding-bottom: 25px;
      }

      .step-wrap:last-child {
        padding-bottom: 0;
      }

      .step-wrap:not(:last-child)::after {
        position: absolute;
        bottom: 4px;
        left: 28px;
        width: 1px;
        height: 17px;
        background: var(--line-strong);
        content: "";
      }

      .step-wrap:not(:last-child)::before {
        position: absolute;
        bottom: 1px;
        left: 24px;
        z-index: 1;
        width: 9px;
        height: 9px;
        border-right: 1px solid var(--line-strong);
        border-bottom: 1px solid var(--line-strong);
        transform: rotate(45deg);
        content: "";
      }

      .step-button {
        display: grid;
        width: 100%;
        grid-template-columns: 56px minmax(0, 1fr) auto;
        align-items: center;
        gap: 16px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--text);
        text-align: left;
        cursor: pointer;
        transition:
          border-color 150ms ease,
          background 150ms ease,
          transform 150ms ease;
      }

      .step-button:hover {
        border-color: var(--line-strong);
        background: var(--surface-strong);
        transform: translateY(-1px);
      }

      .step-button:focus-visible {
        outline: 3px solid rgba(100, 168, 255, 0.45);
        outline-offset: 3px;
      }

      .step-button.active {
        border-color: rgba(100, 168, 255, 0.65);
        background:
          linear-gradient(90deg, rgba(100, 168, 255, 0.11), transparent 70%),
          var(--surface-strong);
      }

      .step-number {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 1px solid var(--line-strong);
        border-radius: 13px;
        color: var(--muted);
        background: var(--surface-soft);
        font-size: 13px;
        font-weight: 800;
      }

      .active .step-number {
        border-color: var(--blue);
        color: #07101d;
        background: var(--blue);
      }

      .step-title {
        display: block;
        margin-bottom: 3px;
        font-weight: 730;
        line-height: 1.3;
      }

      .step-summary {
        display: block;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .step-phase {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 8px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .detail-column {
        position: sticky;
        top: 20px;
        display: grid;
        gap: 12px;
      }

      .panel {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .main-panel {
        padding: clamp(22px, 4vw, 34px);
      }

      .detail-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .detail-counter,
      .detail-phase {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .detail-counter {
        color: var(--blue);
      }

      .detail-phase {
        color: var(--muted);
      }

      .detail-title {
        margin-bottom: 12px;
        font-size: clamp(26px, 3vw, 40px);
        line-height: 1.08;
        letter-spacing: -0.04em;
      }

      .detail-summary {
        margin-bottom: 24px;
        color: #c0cad8;
        font-size: 16px;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .detail-block {
        min-width: 0;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: var(--surface-soft);
      }

      .detail-block.full {
        grid-column: 1 / -1;
      }

      .detail-label {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .detail-value {
        margin: 0;
        color: #dce4ef;
        font-size: 14px;
      }

      .callout {
        padding: 19px 20px;
        border: 1px solid;
        border-radius: var(--radius);
      }

      .callout h3 {
        margin-bottom: 7px;
        font-size: 14px;
        letter-spacing: -0.01em;
      }

      .callout p {
        margin: 0;
        font-size: 13px;
      }

      .failure-panel {
        border-color: rgba(255, 173, 91, 0.48);
        background: var(--orange-soft);
      }

      .failure-panel h3 {
        color: var(--orange);
      }

      .failure-panel p {
        color: #ead0b4;
      }

      .mobile-detail {
        display: none;
      }

      @media (max-width: 1050px) {
        .flow-layout {
          grid-template-columns: minmax(390px, 0.9fr) minmax(390px, 1.1fr);
          gap: 16px;
        }

        .step-button {
          grid-template-columns: 48px minmax(0, 1fr);
        }

        .step-phase {
          display: none;
        }
      }

      @media (max-width: 900px) {
        .flow-layout {
          display: block;
        }

        .detail-column {
          display: none;
        }

        .mobile-detail {
          display: grid;
          gap: 10px;
          margin-top: 12px;
        }

        .mobile-detail .panel {
          box-shadow: none;
        }

        .mobile-detail .main-panel {
          padding: 22px;
        }

        .mobile-detail .detail-title {
          font-size: 25px;
        }

        .mobile-detail .detail-grid {
          grid-template-columns: 1fr;
        }

        .mobile-detail .detail-block.full {
          grid-column: auto;
        }
      }

      @media (max-width: 620px) {
        .page-shell {
          width: min(100% - 20px, 1480px);
          padding-top: 10px;
        }

        .step-button {
          grid-template-columns: 42px minmax(0, 1fr);
          gap: 10px;
          padding: 13px;
        }

        .step-number {
          width: 36px;
          height: 36px;
          border-radius: 11px;
        }

        .step-wrap:not(:last-child)::after {
          left: 25px;
        }

        .step-wrap:not(:last-child)::before {
          left: 21px;
        }

      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        .step-button {
          transition: none;
        }
      }
    </style>
    <style>
      .story-layout {
        display: grid;
        grid-template-columns: minmax(220px, 300px) minmax(0, 1160px);
        justify-content: center;
        gap: clamp(40px, 5vw, 80px);
        align-items: start;
      }

      .story-nav {
        position: sticky;
        top: 20px;
        max-height: calc(100vh - 40px);
        overflow-y: auto;
        padding: 8px 24px 8px 0;
        border-right: 1px solid var(--line);
        scrollbar-width: thin;
      }

      .story-nav-title {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .story-nav ol {
        display: grid;
        gap: 2px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .story-nav-link {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        gap: 8px;
        align-items: baseline;
        padding: 5px 0;
        color: #738196;
        text-decoration: none;
        transition: color 120ms ease;
      }

      .story-nav-link:hover {
        color: #b9c4d3;
      }

      .story-nav-link:focus-visible {
        border-radius: 4px;
        outline: 2px solid rgba(100, 168, 255, 0.6);
        outline-offset: 3px;
      }

      .story-nav-link.active {
        color: var(--text);
      }

      .story-nav-number {
        color: #526075;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        font-weight: 800;
      }

      .story-nav-link.active .story-nav-number {
        color: var(--blue);
      }

      .story-nav-text {
        font-size: 12px;
        font-weight: 650;
        line-height: 1.35;
      }

      .story-content {
        min-width: 0;
      }

      .story {
        min-width: 0;
        padding-bottom: 32vh;
      }

      .story-step {
        padding: 30px 0 42px;
        scroll-margin-top: 20px;
      }

      .story-step:first-child {
        padding-top: 4px;
      }

      .story-step:last-child {
        padding-bottom: 30px;
      }

      .story-step h2 {
        max-width: 1160px;
        margin: 0 0 10px;
        font-size: 23px;
        line-height: 1.3;
        letter-spacing: -0.02em;
      }

      .story-prose {
        max-width: 1160px;
        margin: 0;
        color: #c5ceda;
        font-size: 16px;
        line-height: 1.72;
      }

      .story-sentence {
        display: block;
      }

      @media (max-width: 820px) {
        .page-shell {
          width: min(100% - 24px, 760px);
        }

        .story-layout {
          display: block;
        }

        .story-nav {
          top: 0;
          z-index: 10;
          max-height: none;
          margin: 0 -12px;
          padding: 10px 12px;
          overflow-x: auto;
          overflow-y: hidden;
          border-right: 0;
          border-bottom: 1px solid var(--line);
          background: rgba(8, 11, 17, 0.96);
          backdrop-filter: blur(12px);
        }

        .story-nav-title {
          display: none;
        }

        .story-nav ol {
          display: flex;
          width: max-content;
          gap: 16px;
        }

        .story-nav-link {
          display: block;
          padding: 4px 0;
        }

        .story-nav-text {
          display: none;
        }

        .story-nav-number {
          font-size: 12px;
        }

        .story-step {
          scroll-margin-top: 56px;
        }

        .story-step:first-child {
          padding-top: 24px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .story-nav-link {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <div class="story-layout">
        <nav class="story-nav" aria-label="Release steps">
          <p class="story-nav-title">Release steps</p>
          <ol id="story-nav-list"></ol>
        </nav>

        <div class="story-content">
          <p class="diagram-context">
            Before the process starts, every pull request is open, approved, has passed the
            required checks, and has no merge conflicts. Unready pull requests are not included.
          </p>
          <article class="story" id="story" aria-label="Release process"></article>
        </div>
      </div>
    </main>

    <script>
      const steps = [
        {
          phase: "Submit",
          title: "The release request is submitted",
          story:
            "The Coordinator receives a release request as a JSON document. The request lists the pull requests that belong together. It states whether the frontend, backend, or both must be deployed. It also records any required order, such as backend before frontend. Pull requests that depend on each other belong in the same request. Separate requests are treated as independent.",
          summary: "The JSON request describes the PRs, deployment targets, and any required order.",
          owner: "Release submission",
          happens:
            "The JSON request is sent to the Coordinator. It contains the exact PRs, the frontend and backend deployment targets, and any required order.",
          proof:
            "The Coordinator receives one complete request describing the intended release.",
          gap:
            "Finalize the API schema, maximum batch size, allowed dependency syntax, production-policy choices, and idempotency key rules.",
          failure:
            "A malformed or incomplete request is rejected before it is accepted. No merge, build, or deployment starts."
        },
        {
          phase: "Submit",
          title: "The Coordinator checks who sent the request",
          story:
            "The Coordinator confirms the requester's identity and checks what they are allowed to release. If the requester has permission, the request continues. If not, the Coordinator rejects it.",
          summary: "The system proves who is asking and what they are allowed to release.",
          owner: "Release Coordinator API",
          happens:
            "The API checks the requester identity, repository scope, environment permission, and production policy. It records the real requester rather than trusting a name supplied inside the request body.",
          proof:
            "An auditable identity and authorization decision are attached to the release request.",
          gap:
            "Choose the requester authentication methods, service identities, role model, secret rotation, and emergency-access process.",
          failure:
            "The API rejects the request. Nothing is added to the waiting list and no external workflow is called."
        },
        {
          phase: "Submit",
          title: "The Coordinator accepts or rejects the request",
          story:
            "The Coordinator checks every pull request. It confirms that each one is open, approved, has passed the required checks, can be merged, and fits the deployment plan. If everything passes, the Coordinator saves the request and adds it to the waiting list. Accepted means saved and waiting—not merged or deployed. If anything fails, the Coordinator rejects the request.",
          summary: "Only a valid, fully planned request is accepted and saved.",
          owner: "Release Coordinator using GitHub and its database",
          happens:
            "The Coordinator checks current PR heads, open state, target branches, approvals, required CI, mergeability, duplicate use, deployment targets, and required ordering. It saves the accepted request and exact plan in one durable record.",
          proof:
            "An accepted request ID retrieves the exact PR evidence and deployment plan after a restart. A rejected request is never added to the waiting list.",
          gap:
            "Finalize PR readiness rules, valid deployment targets, duplicate handling, request limits, database guarantees, and retry behaviour when GitHub cannot answer.",
          failure:
            "The request is rejected if any PR or deployment rule is invalid. The Coordinator returns an ID only after the accepted request and its plan are safely saved."
        },
        {
          phase: "Batch",
          title: "The Coordinator freezes the next release batch",
          story:
            "Accepted requests wait for the next release batch. When the Coordinator forms that batch, it saves the exact pull request versions, the frontend and backend scope, the required order, and the current main version for every affected repository. The batch is then fixed. Later changes belong to another batch.",
          summary: "One fixed batch saves the exact plan and starting point for every repository.",
          owner: "Release Coordinator using GitHub and its database",
          happens:
            "The Coordinator selects accepted requests in stable order. It saves their exact PR head SHAs, deployment scope, dependency order, and the current protected main SHA for every affected repository in one durable batch manifest.",
          proof:
            "The immutable batch manifest lists every included request, exact PR head, affected repository, saved main base, deployment target, ordering rule, and batch ID.",
          gap:
            "The batch cutoff, maximum size, fair ordering, emergency priority, manifest format, signing, and retention rules still need to be defined.",
          failure:
            "If the exact plan and every saved main base cannot be recorded safely, the batch is not frozen. No release branch, main change, build, or deployment begins."
        },
        {
          phase: "Prepare",
          title: "The Coordinator prepares the release branches",
          story:
            "The Coordinator creates a temporary release branch from the saved main version in each affected repository. It confirms that every pull request still has the exact saved version. It then merges the planned changes into those branches in the required order. Main does not change during this step.",
          summary: "The exact planned changes are combined on temporary branches while main stays unchanged.",
          owner: "Release Coordinator GitHub App and product repositories",
          happens:
            "For each affected repository, the Coordinator creates a release branch at the saved main base. It rechecks every expected PR head SHA and merges only those versions into the branch in the manifest order.",
          proof:
            "The batch links each release branch and resulting commit to its saved main base, exact PR heads, merge order, and GitHub results.",
          gap:
            "The release-branch naming, cleanup, merge strategy, changed-PR handling, conflict rules, and branch retention still need to be defined.",
          failure:
            "If a pull request changed or a planned merge fails, the batch stops with the exact reason. Main remains unchanged, and no artifact or deployment is produced."
        },
        {
          phase: "Test",
          title: "The Coordinator tests the combined release",
          story:
            "The product repositories run the required checks and tests against the combined release branches. The batch continues only when the exact frontend and backend results both pass. If a merge or test fails, the batch stops and main remains unchanged.",
          summary: "The complete release is tested before any protected main branch changes.",
          owner: "Product repository checks and combined release tests",
          happens:
            "The Coordinator dispatches the required repository checks and cross-repository tests against the exact release-branch commits. Every result is correlated with the batch manifest and branch SHAs.",
          proof:
            "The batch stores the exact release-branch commits, required check names, results, logs, workflow run IDs, and combined-test evidence.",
          gap:
            "The required branch checks, combined test matrix, callback trust, timeout rules, retry budget, and unclear-result policy still need to be defined.",
          failure:
            "A failed merge, check, or test records the exact blocker and stops the batch. Main remains unchanged. A proven infrastructure failure may retry the same branch commits; a code fix enters a later request and batch."
        },
        {
          phase: "Promote",
          title: "The Coordinator promotes the tested release to main",
          story:
            "After the release branches pass, the Coordinator locks the affected release path and checks that every protected main branch still matches its saved starting point. Only then does it move each main branch to the tested release result. It records the previous and new main versions. Every affected repository must reach a truthful result before building or deployment can begin.",
          summary: "Only the tested release result may move protected main forward.",
          owner: "Release Coordinator GitHub App, repository rules, and Coordinator locks",
          happens:
            "The Coordinator claims the required repository release locks, rechecks all saved main bases before the first promotion, and advances each protected main with expected-base guards. It records every old main SHA, tested release SHA, promotion result, and lock owner. The locks remain until the release closes or a rollback or repair is verified.",
          proof:
            "The promotion record links every previous main SHA and new main SHA to the tested release branches, batch manifest, GitHub results, and active release locks.",
          gap:
            "The exact protected-main promotion method, lock lifetime, multi-repository repair procedure, emergency access, and abandoned-release recovery still need to be defined.",
          failure:
            "If any main branch changed from its saved base, nothing is promoted. If promotion partly succeeds across repositories, no build or deployment begins. The Coordinator records the exact state and keeps the release path locked until new revert commits or a deliberate repair leave every affected repository truthful. It never resets or rewrites main."
        },
        {
          phase: "Build",
          title: "The Coordinator builds the promoted release",
          story:
            "The Coordinator starts the product repositories' build workflows from the exact promoted main versions. It saves the frontend and backend artifacts that belong to the batch. Staging and production use those same artifacts. Production never uses an artifact built from a pull request or temporary release branch.",
          summary: "Immutable deployable artifacts are built only from the promoted main versions.",
          owner: "Product repository workflows and trusted artifact storage",
          happens:
            "The Coordinator dispatches canonical builds from the recorded protected-main SHAs. Artifact digests, provenance, logs, workflow run IDs, and included request IDs are linked to the batch manifest.",
          proof:
            "Every deployable has a trusted immutable artifact digest whose provenance names the exact promoted main SHA. No release-branch or pull-request artifact can enter the deployment manifest.",
          gap:
            "Artifact storage, signing, provenance, reproducibility, callback authentication, retention, and build-once support still need to be defined.",
          failure:
            "The batch stops before staging and no environment changes. A proven infrastructure failure may retry the same promoted main versions. A code failure requires a safe revert-commit or repair decision, and the release locks remain held until the repository state is verified."
        },
        {
          phase: "Staging",
          title: "The batch waits until staging is free",
          story:
            "The Coordinator keeps the built batch waiting until shared staging is free. Only one batch can change and check staging at a time. Required earlier batches must finish first. While another batch owns staging, the Coordinator does not start this batch's deployment. This keeps different batches from mixing together or moving staging backward.",
          summary: "Shared staging accepts only one changing and validating batch at a time.",
          owner: "Coordinator staging lane",
          happens:
            "Built batches wait separately from request merging. A batch may use staging only after required earlier batches are finished, so staging cannot accidentally move backward or mix two batches.",
          proof:
            "One durable staging reservation names the batch, current known-good manifest, issued operations, and expiry or heartbeat state.",
          gap:
            "Define whether all services share one staging lane, reservation recovery, maximum validation time, and the exact replacement rules for obsolete batches.",
          failure:
            "The batch waits. It does not dispatch deployment while another owner is changing or checking staging."
        },
        {
          phase: "Staging",
          title: "The Coordinator deploys the backend to staging",
          story:
            "The Coordinator starts the backend staging deployment with the saved backend version. It waits until staging reports that the exact version is running and its health check passes. A temporary infrastructure problem may retry the same version. If the backend does not work, the Coordinator stops the deployment and restores the last working version when possible.",
          summary: "The saved backend version is deployed to staging before the frontend.",
          owner: "Backend deployment workflow",
          happens:
            "The Coordinator starts the backend staging deployment with the saved backend version. It waits until staging reports that the same version is running.",
          proof:
            "The staging backend reports the expected version and passes its health check.",
          gap:
            "Define the backend deployment workflow, version check, timeout, retry rules, and restoration process.",
          failure:
            "A temporary deployment problem retries the same version. If the backend is broken, the deployment stops and restores the last working version when possible."
        },
        {
          phase: "Staging",
          title: "The Coordinator deploys the frontend to staging",
          story:
            "After the backend is ready, the Coordinator starts the frontend staging deployment with the saved frontend version. It waits until staging reports that the exact version is running and works with the backend. A temporary infrastructure problem may retry the same version. If the frontend does not work, the Coordinator stops the deployment and restores the last working version when possible.",
          summary: "The saved frontend version is deployed after the backend works.",
          owner: "Frontend deployment workflow",
          happens:
            "After the backend passes its staging check, the Coordinator starts the frontend staging deployment with the saved frontend version. It waits until staging reports that the same version is running.",
          proof:
            "The staging frontend reports the expected version and works with the backend.",
          gap:
            "Define the frontend deployment workflow, version check, cache handling, timeout, retry rules, and restoration process.",
          failure:
            "A temporary deployment problem retries the same version. If the frontend is broken, the deployment stops and restores the last working version when possible."
        },
        {
          phase: "Verify",
          title: "The Coordinator checks the batch in staging",
          story:

      const storyNavRoot = document.querySelector("#story-nav-list");
      const storyRoot = document.querySelector("#story");
      const storyNav = document.querySelector(".story-nav");
      const navLinks = [];
      const storySections = [];
      let activeIndex = readInitialStep();

      function readInitialStep() {
        const rawStep = new URLSearchParams(window.location.search).get("step");
        const requested = Number.parseInt(rawStep || "1", 10);
        return Number.isInteger(requested) && requested >= 1 && requested <= steps.length
          ? requested - 1
          : 0;
      }

      function storyMarkup(step, index) {
        return `
          <h2 id="story-step-title-${index + 1}">${step.title}</h2>
          <p class="story-prose">${storySentenceMarkup(step.story)}</p>
        `;
      }

      function storySentenceMarkup(story) {
        const sentences = story.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [story];
        return sentences
          .map((sentence) => `<span class="story-sentence">${sentence.trim()}</span>`)
          .join("");
      }

      function setActiveStep(index, options = {}) {
        const nextIndex = Math.max(0, Math.min(steps.length - 1, index));
        activeIndex = nextIndex;

        navLinks.forEach((link, linkIndex) => {
          const active = linkIndex === activeIndex;
          link.classList.toggle("active", active);
          if (active) {
            link.setAttribute("aria-current", "step");
          } else {
            link.removeAttribute("aria-current");
          }
        });

        if (options.updateUrl !== false) {
          const url = new URL(window.location.href);
          url.searchParams.set("step", String(activeIndex + 1));
          url.hash = "";
          window.history.replaceState({}, "", url);
        }

        const activeLink = navLinks[activeIndex];
        if (window.matchMedia("(max-width: 820px)").matches) {
          storyNav.scrollTo({
            left: activeLink.offsetLeft - storyNav.clientWidth / 2 + activeLink.clientWidth / 2,
            behavior: "smooth"
          });
        } else {
          const linkTop = activeLink.offsetTop;
          const linkBottom = linkTop + activeLink.offsetHeight;
          const visibleTop = storyNav.scrollTop;
          const visibleBottom = visibleTop + storyNav.clientHeight;

          if (linkTop < visibleTop || linkBottom > visibleBottom) {
            storyNav.scrollTo({
              top: Math.max(0, linkTop - storyNav.clientHeight / 2),
              behavior: "smooth"
            });
          }
        }
      }

      function scrollToStep(index) {
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        storySections[index].scrollIntoView({
          block: "start",
          behavior: reducedMotion ? "auto" : "smooth"
        });
        setActiveStep(index);
      }

      steps.forEach((step, index) => {
        const navItem = document.createElement("li");
        const navLink = document.createElement("a");
        navLink.className = "story-nav-link";
        navLink.href = `#step-${index + 1}`;
        navLink.innerHTML = `
          <span class="story-nav-number">${String(index + 1).padStart(2, "0")}</span>
          <span class="story-nav-text">${step.title}</span>
        `;
        navLink.addEventListener("click", (event) => {
          event.preventDefault();
          scrollToStep(index);
        });

        const section = document.createElement("section");
        section.className = "story-step";
        section.id = `step-${index + 1}`;
        section.setAttribute("aria-labelledby", `story-step-title-${index + 1}`);
        section.innerHTML = storyMarkup(step, index);

        navItem.append(navLink);
        storyNavRoot.append(navItem);
        storyRoot.append(section);
        navLinks.push(navLink);
        storySections.push(section);
      });

      function updateActiveStepFromScroll() {
        const readingLine = Math.min(window.innerHeight * 0.3, 260);
        let nextIndex = 0;

        storySections.forEach((section, index) => {
          if (section.getBoundingClientRect().top <= readingLine) {
            nextIndex = index;
          }
        });

        const atPageEnd = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2;
        if (atPageEnd) {
          nextIndex = storySections.length - 1;
        }

        if (nextIndex !== activeIndex) {
          setActiveStep(nextIndex);
        }
      }

      let scrollFrame = 0;
      function queueActiveStepUpdate() {
        if (scrollFrame) {
          return;
        }

        scrollFrame = window.requestAnimationFrame(() => {
          scrollFrame = 0;
          updateActiveStepFromScroll();
        });
      }

      window.addEventListener("scroll", queueActiveStepUpdate, { passive: true });
      window.addEventListener("resize", queueActiveStepUpdate);

      setActiveStep(activeIndex);
      if (activeIndex > 0) {
        window.requestAnimationFrame(() => {
          storySections[activeIndex].scrollIntoView({ block: "start" });
        });
      } else {
        window.requestAnimationFrame(updateActiveStepFromScroll);
      }
    </script>
