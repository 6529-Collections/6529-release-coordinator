<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Interactive design diagram for the proposed 6529 Release Coordinator."
    />
    <title>6529 Release Coordinator — Process Diagram</title>
    <style>
      :root {
        color-scheme: dark;
        --page: #080b11;
        --surface: #10151e;
        --surface-strong: #151c27;
        --surface-soft: #0c1119;
        --line: #293242;
        --line-strong: #3a475b;
        --text: #f3f6fb;
        --muted: #9aa8ba;
        --blue: #64a8ff;
        --blue-soft: rgba(100, 168, 255, 0.12);
        --green: #58d6a1;
        --green-soft: rgba(88, 214, 161, 0.12);
        --orange: #ffad5b;
        --orange-soft: rgba(255, 173, 91, 0.12);
        --red: #ff7e87;
        --red-soft: rgba(255, 126, 135, 0.12);
        --shadow: 0 22px 70px rgba(0, 0, 0, 0.3);
        --radius: 16px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: var(--page);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        line-height: 1.55;
      }

      button,
      a {
        font: inherit;
      }

      a {
        color: var(--blue);
      }

      .page-shell {
        width: min(1800px, calc(100% - 32px));
        margin: 0 auto;
        padding: 20px 0 40px;
      }

      h2,
      h3,
      p {
        margin-top: 0;
      }

      .diagram-context {
        max-width: none;
        margin: 0 0 22px;
        padding: 14px 16px;
        border-left: 3px solid var(--blue);
        border-radius: 0 8px 8px 0;
        background: var(--blue-soft);
        color: #dcecff;
        font-size: 17px;
        font-weight: 600;
        line-height: 1.55;
      }

      .flow-layout {
        display: grid;
        grid-template-columns: minmax(460px, 0.95fr) minmax(430px, 1.05fr);
        gap: 24px;
        align-items: start;
        margin-top: 0;
      }

      .flow-column,
      .detail-column {
        min-width: 0;
      }

      .steps {
        display: grid;
        gap: 0;
      }

      .step-wrap {
        position: relative;
        padding-bottom: 25px;
      }

      .step-wrap:last-child {
        padding-bottom: 0;
      }

      .step-wrap:not(:last-child)::after {
        position: absolute;
        bottom: 4px;
        left: 28px;
        width: 1px;
        height: 17px;
        background: var(--line-strong);
        content: "";
      }

      .step-wrap:not(:last-child)::before {
        position: absolute;
        bottom: 1px;
        left: 24px;
        z-index: 1;
        width: 9px;
        height: 9px;
        border-right: 1px solid var(--line-strong);
        border-bottom: 1px solid var(--line-strong);
        transform: rotate(45deg);
        content: "";
      }

      .step-button {
        display: grid;
        width: 100%;
        grid-template-columns: 56px minmax(0, 1fr) auto;
        align-items: center;
        gap: 16px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--text);
        text-align: left;
        cursor: pointer;
        transition:
          border-color 150ms ease,
          background 150ms ease,
          transform 150ms ease;
      }

      .step-button:hover {
        border-color: var(--line-strong);
        background: var(--surface-strong);
        transform: translateY(-1px);
      }

      .step-button:focus-visible {
        outline: 3px solid rgba(100, 168, 255, 0.45);
        outline-offset: 3px;
      }

      .step-button.active {
        border-color: rgba(100, 168, 255, 0.65);
        background:
          linear-gradient(90deg, rgba(100, 168, 255, 0.11), transparent 70%),
          var(--surface-strong);
      }

      .step-number {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 1px solid var(--line-strong);
        border-radius: 13px;
        color: var(--muted);
        background: var(--surface-soft);
        font-size: 13px;
        font-weight: 800;
      }

      .active .step-number {
        border-color: var(--blue);
        color: #07101d;
        background: var(--blue);
      }

      .step-title {
        display: block;
        margin-bottom: 3px;
        font-weight: 730;
        line-height: 1.3;
      }

      .step-summary {
        display: block;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .step-phase {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 8px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .detail-column {
        position: sticky;
        top: 20px;
        display: grid;
        gap: 12px;
      }

      .panel {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .main-panel {
        padding: clamp(22px, 4vw, 34px);
      }

      .detail-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .detail-counter,
      .detail-phase {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .detail-counter {
        color: var(--blue);
      }

      .detail-phase {
        color: var(--muted);
      }

      .detail-title {
        margin-bottom: 12px;
        font-size: clamp(26px, 3vw, 40px);
        line-height: 1.08;
        letter-spacing: -0.04em;
      }

      .detail-summary {
        margin-bottom: 24px;
        color: #c0cad8;
        font-size: 16px;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .detail-block {
        min-width: 0;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: var(--surface-soft);
      }

      .detail-block.full {
        grid-column: 1 / -1;
      }

      .detail-label {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .detail-value {
        margin: 0;
        color: #dce4ef;
        font-size: 14px;
      }

      .callout {
        padding: 19px 20px;
        border: 1px solid;
        border-radius: var(--radius);
      }

      .callout h3 {
        margin-bottom: 7px;
        font-size: 14px;
        letter-spacing: -0.01em;
      }

      .callout p {
        margin: 0;
        font-size: 13px;
      }

      .failure-panel {
        border-color: rgba(255, 173, 91, 0.48);
        background: var(--orange-soft);
      }

      .failure-panel h3 {
        color: var(--orange);
      }

      .failure-panel p {
        color: #ead0b4;
      }

      .mobile-detail {
        display: none;
      }

      @media (max-width: 1050px) {
        .flow-layout {
          grid-template-columns: minmax(390px, 0.9fr) minmax(390px, 1.1fr);
          gap: 16px;
        }

        .step-button {
          grid-template-columns: 48px minmax(0, 1fr);
        }

        .step-phase {
          display: none;
        }
      }

      @media (max-width: 900px) {
        .flow-layout {
          display: block;
        }

        .detail-column {
          display: none;
        }

        .mobile-detail {
          display: grid;
          gap: 10px;
          margin-top: 12px;
        }

        .mobile-detail .panel {
          box-shadow: none;
        }

        .mobile-detail .main-panel {
          padding: 22px;
        }

        .mobile-detail .detail-title {
          font-size: 25px;
        }

        .mobile-detail .detail-grid {
          grid-template-columns: 1fr;
        }

        .mobile-detail .detail-block.full {
          grid-column: auto;
        }
      }

      @media (max-width: 620px) {
        .page-shell {
          width: min(100% - 20px, 1480px);
          padding-top: 10px;
        }

        .step-button {
          grid-template-columns: 42px minmax(0, 1fr);
          gap: 10px;
          padding: 13px;
        }

        .step-number {
          width: 36px;
          height: 36px;
          border-radius: 11px;
        }

        .step-wrap:not(:last-child)::after {
          left: 25px;
        }

        .step-wrap:not(:last-child)::before {
          left: 21px;
        }

      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        .step-button {
          transition: none;
        }
      }
    </style>
    <style>
      .story-layout {
        max-width: 1500px;
        margin: 0 auto;
      }

      .story-nav {
        position: sticky;
        top: 0;
        z-index: 10;
        margin-bottom: 22px;
        padding: 10px 2px;
        overflow-x: auto;
        overflow-y: hidden;
        border-bottom: 1px solid var(--line);
        background: rgba(8, 11, 17, 0.96);
        backdrop-filter: blur(12px);
        scrollbar-width: thin;
      }

      .story-nav-title {
        display: none;
      }

      .story-nav ol {
        display: flex;
        width: max-content;
        min-width: 100%;
        justify-content: space-between;
        gap: clamp(8px, 1vw, 16px);
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .story-nav-link {
        display: block;
        padding: 4px 0;
        color: #738196;
        text-decoration: none;
        transition: color 120ms ease;
      }

      .story-nav-link:hover {
        color: #b9c4d3;
      }

      .story-nav-link:focus-visible {
        border-radius: 4px;
        outline: 2px solid rgba(100, 168, 255, 0.6);
        outline-offset: 3px;
      }

      .story-nav-link.active {
        color: var(--text);
      }

      .story-nav-number {
        color: #526075;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        font-weight: 800;
      }

      .story-nav-link.active .story-nav-number {
        color: var(--blue);
      }

      .story-nav-text {
        display: none;
      }

      .story-content {
        min-width: 0;
      }

      .story {
        min-width: 0;
        padding-bottom: 32vh;
      }

      .story-step {
        padding: 28px 0 44px;
        scroll-margin-top: 62px;
      }

      .story-step:first-child {
        padding-top: 4px;
      }

      .story-step:last-child {
        padding-bottom: 30px;
      }

      .story-step h2 {
        margin: 0 0 16px;
        font-size: 23px;
        line-height: 1.3;
        letter-spacing: -0.02em;
      }

      .story-pair {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .story-panel {
        min-width: 0;
        padding: 18px 20px 20px;
        border: 1px dashed rgba(154, 168, 186, 0.34);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.012);
      }

      .story-panel-why {
        border-color: rgba(100, 168, 255, 0.42);
        background: rgba(100, 168, 255, 0.055);
      }

      .story-panel-label {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.1em;
        line-height: 1;
        text-transform: uppercase;
      }

      .story-panel-why .story-panel-label {
        color: var(--blue);
      }

      .story-prose {
        margin: 0;
        color: #c5ceda;
        font-size: 16px;
        line-height: 1.72;
      }

      .story-sentence {
        display: block;
      }

      @media (max-width: 820px) {
        .page-shell {
          width: min(100% - 24px, 760px);
        }

        .story-nav {
          margin: 0 -12px 18px;
          padding: 10px 12px;
        }

        .story-step {
          scroll-margin-top: 56px;
        }

        .story-step:first-child {
          padding-top: 24px;
        }

        .story-pair {
          grid-template-columns: 1fr;
          gap: 12px;
        }

        .story-panel {
          padding: 16px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .story-nav-link {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <div class="story-layout">
        <nav class="story-nav" aria-label="Release steps">
          <p class="story-nav-title">Release steps</p>
          <ol id="story-nav-list"></ol>
        </nav>

        <div class="story-content">
          <p class="diagram-context">
            Before the process starts, every pull request is open, approved, has passed the
            required checks, and has no merge conflicts. Unready pull requests are not included.
          </p>
          <article class="story" id="story" aria-label="Release process"></article>
        </div>
      </div>
    </main>

    <script>
      const steps = [
        {
          phase: "Submit",
          title: "Submit the release request",
          story:
            "Someone sends one JSON request to the Coordinator. It lists the pull requests that must be released together. It says whether the frontend, backend, or both must be deployed. It gives the correct order and says whether the database will change. Pull requests that need each other must be in the same request. Separate requests are handled independently.",
          why:
            "The Coordinator needs one complete plan before it starts. This keeps related changes together, prevents the wrong deployment order, and shows when automatic rollback may be unsafe.",
          summary: "The JSON request describes the PRs, deployment targets, required order, and database-change declaration.",
          owner: "Release submission",
          happens:
            "The JSON request is sent to the Coordinator. It contains the exact PRs, the frontend and backend deployment targets, any required order, and the requester's database-change declaration.",
          proof:
            "The Coordinator receives one complete request describing the intended release and its declared database classification.",
          gap:
            "The request format, database-change values, maximum batch size, dependency format, and duplicate-request rules still need to be defined.",
          failure:
            "A malformed or incomplete request is rejected before it is accepted. No merge, build, or deployment starts."
        },
        {
          phase: "Submit",
          title: "Check who sent it",
          story:
            "The Coordinator checks the identity of the person or tool that sent the request. It checks whether they are allowed to release these pull requests. If yes, the request continues. If not, it is rejected.",
          why:
            "Only approved people and tools should be able to start a release. This stops someone from deploying changes they are not allowed to control.",
          summary: "The system proves who is asking and what they are allowed to release.",
          owner: "Release Coordinator API",
          happens:
            "The API checks the requester identity and whether they may release the named pull requests. It records the real requester instead of trusting a name inside the request.",
          proof:
            "An auditable identity and authorization decision are attached to the release request.",
          gap:
            "Choose the requester authentication methods, service identities, role model, secret rotation, and emergency-access process.",
          failure:
            "The API rejects the request. Nothing is added to the waiting list and no external workflow is called."
        },
        {
          phase: "Submit",
          title: "Check the pull requests",
          story:
            "The Coordinator checks every pull request. Each one must be open, approved, passing its required checks, ready to merge, and part of the release plan. The saved pull request version must still match. If anything is wrong, the request is rejected.",
          why:
            "Only ready work should enter the waiting list. This stops an incomplete or changed pull request from blocking a later release.",
          summary: "Every pull request must be ready and match the release plan.",
          owner: "Release Coordinator using GitHub",
          happens:
            "The Coordinator checks each pull request's exact version, open state, target branch, approval, required checks, merge readiness, deployment target, and place in the release order.",
          proof:
            "The request stores the result of every pull request check and the exact version that was checked.",
          gap:
            "The exact readiness rules, valid deployment targets, duplicate handling, request limits, and GitHub retry rules still need to be defined.",
          failure:
            "If any pull request is not ready or does not match the request, the request is rejected. Nothing enters the waiting list."
        },
        {
          phase: "Submit",
          title: "Decide recovery safety",
          story:
            "The request says whether the database will change. The Coordinator checks the changed files too. If either says yes, the request is marked as a database change. If the answer is unclear, a person decides. When the answer is clear, the Coordinator saves the request and adds it to the waiting list. Accepted only means saved and waiting. Nothing has been merged or deployed yet.",
          why:
            "A database change may make the old application unsafe with the new data. This decision tells the Coordinator whether it may recover automatically or must wait for a person.",
          summary: "The request gets one clear recovery rule before it enters the waiting list.",
          owner: "Release Coordinator using its database and the changed files",
          happens:
            "The Coordinator compares the request's database answer with known database and schema file paths. A yes from either source means database change. An unclear answer waits for an allowed person. The request and its evidence are saved together.",
          proof:
            "The saved request shows the database answer, the files that were checked, the final decision, and any human decision.",
          gap:
            "The known database paths, allowed human decision makers, and rules for an unclear answer still need to be defined.",
          failure:
            "An unclear request does not enter the waiting list until a person decides. If the request cannot be saved safely, it is not accepted."
        },
        {
          phase: "Queue",
          title: "Reserve the release lane",
          story:
            "Accepted requests wait until no other batch is being released. When the lane is free, the Coordinator reserves it for the next batch. Until that batch finishes or recovery is complete, no other batch may freeze versions, change main, use staging, or deploy to production. Developers may continue working on pull requests, but those changes wait for a later batch.",
          why:
            "One batch needs a clear path from its saved versions to production. This prevents main from changing underneath it, stops different versions from mixing, and keeps recovery safe.",
          summary: "One active batch owns the full release path until it finishes or recovery is complete.",
          owner: "Release Coordinator and its durable release-lane record",
          happens:
            "The Coordinator atomically reserves one global release lane for the next accepted work. The reservation prevents every other batch from freezing a manifest, changing protected main, using staging, or deploying to production. Request intake, pull-request development, review, and CI may continue outside the lane.",
          proof:
            "One durable release-lane record names the active release attempt, reservation owner, acquisition time, heartbeat, current phase, and terminal release or recovery result.",
          gap:
            "The lane lease duration, heartbeat, abandoned-owner recovery, fair queue selection, emergency override, and manual-deployment blocking rules still need to be defined.",
          failure:
            "If the Coordinator cannot prove that the lane is free and reserve it safely, no batch is frozen and nothing changes in main, staging, or production. If the reservation is later lost or becomes uncertain, all new release actions stop until the lane is recovered or a person resolves it."
        },
        {
          phase: "Batch",
          title: "Freeze the release batch",
          story:
            "With the release lane reserved, the Coordinator chooses the accepted requests that will be released together. It saves the exact pull request versions, what must be deployed, the correct order, and the current main version in each repository. A request that changes the database gets its own batch with only the changes it needs. Unrelated requests wait for another batch. After this, the batch cannot change.",
          why:
            "The Coordinator needs one exact plan for the active release. Freezing the batch makes sure it tests and deploys the same code. Keeping database changes separate also protects unrelated work if recovery is needed.",
          summary: "One fixed batch saves the exact plan, starting points, and database policy.",
          owner: "Release Coordinator using GitHub and its database",
          happens:
            "The Coordinator selects accepted requests in stable order. If a selected request is database-changing, it creates a dedicated batch containing that request and only its complete required dependency group; no unrelated accepted request may join. Otherwise it may form a normal non-database batch. It saves every exact PR head SHA, database classification, deployment scope, dependency order, and current protected main SHA in one durable batch manifest.",
          proof:
            "The immutable batch manifest lists every included request, exact PR head, database classification and evidence, dependency edge, affected repository, saved main base, deployment target, ordering rule, and batch ID. A database-changing manifest proves that every included request belongs to the required dependency group.",
          gap:
            "The dependency-group validation, dedicated-batch scheduling, batch cutoff, maximum size, fair ordering, emergency priority, manifest format, signing, and retention rules still need to be defined.",
          failure:
            "If the exact plan cannot be saved, the batch is not frozen. Nothing changed, so the Coordinator saves the reason and releases the lane."
        },
        {
          phase: "Prepare",
          title: "Prepare the release branches",
          story:
            "The Coordinator creates a temporary release branch in every affected repository. Each branch starts from the saved main version. It checks that every pull request still has the saved version. It then adds the planned changes in the correct order. The real main branches do not change yet. If preparation fails, the reason is saved and the lane is released.",
          why:
            "This gives the Coordinator a safe place to combine and test the batch. If a pull request changed or the changes do not fit together, it can stop without changing main.",
          summary: "The exact planned changes are combined on temporary branches while main stays unchanged.",
          owner: "Release Coordinator GitHub App and product repositories",
          happens:
            "For each affected repository, the Coordinator creates a release branch at the saved main base. It rechecks every expected PR head SHA and merges only those versions into the branch in the manifest order.",
          proof:
            "The batch links each release branch and resulting commit to its saved main base, exact PR heads, merge order, and GitHub results.",
          gap:
            "The release-branch naming, cleanup, merge strategy, changed-PR handling, conflict rules, and branch retention still need to be defined.",
          failure:
            "If a pull request changed or the planned merge fails, the batch stops with the exact reason. Main remains unchanged, and the Coordinator releases the lane."
        },
        {
          phase: "Test",
          title: "Test the full batch",
          story:
            "The frontend and backend run their required checks on the combined release branches. These checks test the whole batch together. If both sides pass, the batch continues unchanged. If a required check fails, the reason is saved and the lane is released. Main still does not change.",
          why:
            "A pull request can pass on its own but fail when combined with other work. This step finds those problems before anything reaches main or is deployed.",
          summary: "The complete release is tested before any protected main branch changes.",
          owner: "Product repository checks and combined release tests",
          happens:
            "The Coordinator dispatches the required repository checks and cross-repository tests against the exact release-branch commits. Every result is correlated with the batch manifest and branch SHAs.",
          proof:
            "The batch stores the exact release-branch commits, required check names, results, logs, workflow run IDs, and combined-test evidence.",
          gap:
            "The required branch checks, combined test matrix, callback trust, timeout rules, retry budget, and unclear-result policy still need to be defined.",
          failure:
            "A failed or unclear check saves the exact blocker. A proven service problem may retry the same test. A code failure stops for a person. Main remains unchanged, and the Coordinator releases the lane."
        },
        {
          phase: "Promote",
          title: "Recheck before changing main",
          story:
            "After the full batch passes, the Coordinator checks every pull request again. Each one must still be open, approved, passing its required checks, and using the saved version. It also checks that every main branch still has the saved starting version. If everything matches, the Coordinator immediately continues. If anything changed, the batch stops and the lane is released.",
          why:
            "The first checks may be old after waiting and testing. This is the last safety check before the Coordinator changes main.",
          summary: "The tested batch must still be allowed and safe to move to main.",
          owner: "Release Coordinator using GitHub and the release lane",
          happens:
            "While holding the release lane, the Coordinator rechecks the exact pull request versions, open state, approvals, required checks, dependencies, and saved main versions. It moves to the next step without releasing the lane.",
          proof:
            "The batch stores fresh GitHub results and the saved main versions checked just before main changes.",
          gap:
            "The freshness limit, GitHub retry rules, and emergency-change rules still need to be defined.",
          failure:
            "If any result is missing, old, or different, main does not change. The batch stops with the exact reason, and the Coordinator releases the lane."
        },
        {
          phase: "Promote",
          title: "Move tested code to main",
          story:
            "With the release lane still reserved, the Coordinator moves each main branch to the exact result that was tested. It checks the saved starting version again while making each change. It saves the old and new versions. The process continues only when the result is known for every affected repository.",
          why:
            "The release lane stops other batches from changing main. Checking the starting version during the move catches a last-second change. Saving the old and new versions gives a clear recovery record.",
          summary: "Only the tested release result may move protected main forward.",

      const storyNavRoot = document.querySelector("#story-nav-list");
      const storyRoot = document.querySelector("#story");
      const storyNav = document.querySelector(".story-nav");
      const navLinks = [];
      const storySections = [];
      let activeIndex = readInitialStep();

      function readInitialStep() {
        const rawStep = new URLSearchParams(window.location.search).get("step");
        const requested = Number.parseInt(rawStep || "1", 10);
        return Number.isInteger(requested) && requested >= 1 && requested <= steps.length
          ? requested - 1
          : 0;
      }

      function storyMarkup(step, index) {
        return `
          <h2 id="story-step-title-${index + 1}">${step.title}</h2>
          <div class="story-pair">
            <div class="story-panel story-panel-what">
              <p class="story-panel-label">What</p>
              <p class="story-prose">${storySentenceMarkup(step.story)}</p>
            </div>
            <div class="story-panel story-panel-why">
              <p class="story-panel-label">Why</p>
              ${step.why ? `<p class="story-prose">${storySentenceMarkup(step.why)}</p>` : ""}
            </div>
          </div>
        `;
      }

      function storySentenceMarkup(story) {
        const sentences = story.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [story];
        return sentences
          .map((sentence) => `<span class="story-sentence">${sentence.trim()}</span>`)
          .join("");
      }

      function setActiveStep(index, options = {}) {
        const nextIndex = Math.max(0, Math.min(steps.length - 1, index));
        activeIndex = nextIndex;

        navLinks.forEach((link, linkIndex) => {
          const active = linkIndex === activeIndex;
          link.classList.toggle("active", active);
          if (active) {
            link.setAttribute("aria-current", "step");
          } else {
            link.removeAttribute("aria-current");
          }
        });

        if (options.updateUrl !== false) {
          const url = new URL(window.location.href);
          url.searchParams.set("step", String(activeIndex + 1));
          url.hash = "";
          window.history.replaceState({}, "", url);
        }

        const activeLink = navLinks[activeIndex];
        storyNav.scrollTo({
          left: activeLink.offsetLeft - storyNav.clientWidth / 2 + activeLink.clientWidth / 2,
          behavior: "smooth"
        });
      }

      function scrollToStep(index) {
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        storySections[index].scrollIntoView({
          block: "start",
          behavior: reducedMotion ? "auto" : "smooth"
        });
        setActiveStep(index);
      }

      steps.forEach((step, index) => {
        const navItem = document.createElement("li");
        const navLink = document.createElement("a");
        navLink.className = "story-nav-link";
        navLink.href = `#step-${index + 1}`;
        navLink.innerHTML = `
          <span class="story-nav-number">${String(index + 1).padStart(2, "0")}</span>
          <span class="story-nav-text">${step.title}</span>
        `;
        navLink.addEventListener("click", (event) => {
          event.preventDefault();
          scrollToStep(index);
        });

        const section = document.createElement("section");
        section.className = "story-step";
        section.id = `step-${index + 1}`;
        section.setAttribute("aria-labelledby", `story-step-title-${index + 1}`);
        section.innerHTML = storyMarkup(step, index);

        navItem.append(navLink);
        storyNavRoot.append(navItem);
        storyRoot.append(section);
        navLinks.push(navLink);
        storySections.push(section);
      });

      function updateActiveStepFromScroll() {
        const readingLine = Math.min(window.innerHeight * 0.3, 260);
        let nextIndex = 0;

        storySections.forEach((section, index) => {
          if (section.getBoundingClientRect().top <= readingLine) {
            nextIndex = index;
          }
        });

        const atPageEnd = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2;
        if (atPageEnd) {
          nextIndex = storySections.length - 1;
        }

        if (nextIndex !== activeIndex) {
          setActiveStep(nextIndex);
        }
      }

      let scrollFrame = 0;
      function queueActiveStepUpdate() {
        if (scrollFrame) {
          return;
        }

        scrollFrame = window.requestAnimationFrame(() => {
          scrollFrame = 0;
          updateActiveStepFromScroll();
        });
      }

      window.addEventListener("scroll", queueActiveStepUpdate, { passive: true });
      window.addEventListener("resize", queueActiveStepUpdate);

      setActiveStep(activeIndex);
      if (activeIndex > 0) {
        window.requestAnimationFrame(() => {
          storySections[activeIndex].scrollIntoView({ block: "start" });
        });
      } else {
        window.requestAnimationFrame(updateActiveStepFromScroll);
      }
