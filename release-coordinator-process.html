<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Interactive design diagram for the proposed 6529 Release Coordinator."
    />
    <title>6529 Release Coordinator — Process Diagram</title>
    <style>
      :root {
        color-scheme: dark;
        --page: #080b11;
        --surface: #10151e;
        --surface-strong: #151c27;
        --surface-soft: #0c1119;
        --line: #293242;
        --line-strong: #3a475b;
        --text: #f3f6fb;
        --muted: #9aa8ba;
        --blue: #64a8ff;
        --blue-soft: rgba(100, 168, 255, 0.12);
        --green: #58d6a1;
        --green-soft: rgba(88, 214, 161, 0.12);
        --orange: #ffad5b;
        --orange-soft: rgba(255, 173, 91, 0.12);
        --red: #ff7e87;
        --red-soft: rgba(255, 126, 135, 0.12);
        --shadow: 0 22px 70px rgba(0, 0, 0, 0.3);
        --radius: 16px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: var(--page);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        line-height: 1.55;
      }

      button,
      a {
        font: inherit;
      }

      a {
        color: var(--blue);
      }

      .page-shell {
        width: min(1800px, calc(100% - 32px));
        margin: 0 auto;
        padding: 20px 0 40px;
      }

      h2,
      h3,
      p {
        margin-top: 0;
      }

      .diagram-context {
        margin: 0 0 14px 2px;
        color: var(--muted);
        font-size: 12px;
      }

      .flow-layout {
        display: grid;
        grid-template-columns: minmax(460px, 0.95fr) minmax(430px, 1.05fr);
        gap: 24px;
        align-items: start;
        margin-top: 0;
      }

      .flow-column,
      .detail-column {
        min-width: 0;
      }

      .steps {
        display: grid;
        gap: 0;
      }

      .step-wrap {
        position: relative;
        padding-bottom: 25px;
      }

      .step-wrap:last-child {
        padding-bottom: 0;
      }

      .step-wrap:not(:last-child)::after {
        position: absolute;
        bottom: 4px;
        left: 28px;
        width: 1px;
        height: 17px;
        background: var(--line-strong);
        content: "";
      }

      .step-wrap:not(:last-child)::before {
        position: absolute;
        bottom: 1px;
        left: 24px;
        z-index: 1;
        width: 9px;
        height: 9px;
        border-right: 1px solid var(--line-strong);
        border-bottom: 1px solid var(--line-strong);
        transform: rotate(45deg);
        content: "";
      }

      .step-button {
        display: grid;
        width: 100%;
        grid-template-columns: 56px minmax(0, 1fr) auto;
        align-items: center;
        gap: 16px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--text);
        text-align: left;
        cursor: pointer;
        transition:
          border-color 150ms ease,
          background 150ms ease,
          transform 150ms ease;
      }

      .step-button:hover {
        border-color: var(--line-strong);
        background: var(--surface-strong);
        transform: translateY(-1px);
      }

      .step-button:focus-visible {
        outline: 3px solid rgba(100, 168, 255, 0.45);
        outline-offset: 3px;
      }

      .step-button.active {
        border-color: rgba(100, 168, 255, 0.65);
        background:
          linear-gradient(90deg, rgba(100, 168, 255, 0.11), transparent 70%),
          var(--surface-strong);
      }

      .step-number {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 1px solid var(--line-strong);
        border-radius: 13px;
        color: var(--muted);
        background: var(--surface-soft);
        font-size: 13px;
        font-weight: 800;
      }

      .active .step-number {
        border-color: var(--blue);
        color: #07101d;
        background: var(--blue);
      }

      .step-title {
        display: block;
        margin-bottom: 3px;
        font-weight: 730;
        line-height: 1.3;
      }

      .step-summary {
        display: block;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .step-phase {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 8px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .detail-column {
        position: sticky;
        top: 20px;
        display: grid;
        gap: 12px;
      }

      .panel {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .main-panel {
        padding: clamp(22px, 4vw, 34px);
      }

      .detail-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .detail-counter,
      .detail-phase {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .detail-counter {
        color: var(--blue);
      }

      .detail-phase {
        color: var(--muted);
      }

      .detail-title {
        margin-bottom: 12px;
        font-size: clamp(26px, 3vw, 40px);
        line-height: 1.08;
        letter-spacing: -0.04em;
      }

      .detail-summary {
        margin-bottom: 24px;
        color: #c0cad8;
        font-size: 16px;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .detail-block {
        min-width: 0;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: var(--surface-soft);
      }

      .detail-block.full {
        grid-column: 1 / -1;
      }

      .detail-label {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .detail-value {
        margin: 0;
        color: #dce4ef;
        font-size: 14px;
      }

      .callout {
        padding: 19px 20px;
        border: 1px solid;
        border-radius: var(--radius);
      }

      .callout h3 {
        margin-bottom: 7px;
        font-size: 14px;
        letter-spacing: -0.01em;
      }

      .callout p {
        margin: 0;
        font-size: 13px;
      }

      .failure-panel {
        border-color: rgba(255, 173, 91, 0.48);
        background: var(--orange-soft);
      }

      .failure-panel h3 {
        color: var(--orange);
      }

      .failure-panel p {
        color: #ead0b4;
      }

      .mobile-detail {
        display: none;
      }

      @media (max-width: 1050px) {
        .flow-layout {
          grid-template-columns: minmax(390px, 0.9fr) minmax(390px, 1.1fr);
          gap: 16px;
        }

        .step-button {
          grid-template-columns: 48px minmax(0, 1fr);
        }

        .step-phase {
          display: none;
        }
      }

      @media (max-width: 900px) {
        .flow-layout {
          display: block;
        }

        .detail-column {
          display: none;
        }

        .mobile-detail {
          display: grid;
          gap: 10px;
          margin-top: 12px;
        }

        .mobile-detail .panel {
          box-shadow: none;
        }

        .mobile-detail .main-panel {
          padding: 22px;
        }

        .mobile-detail .detail-title {
          font-size: 25px;
        }

        .mobile-detail .detail-grid {
          grid-template-columns: 1fr;
        }

        .mobile-detail .detail-block.full {
          grid-column: auto;
        }
      }

      @media (max-width: 620px) {
        .page-shell {
          width: min(100% - 20px, 1480px);
          padding-top: 10px;
        }

        .step-button {
          grid-template-columns: 42px minmax(0, 1fr);
          gap: 10px;
          padding: 13px;
        }

        .step-number {
          width: 36px;
          height: 36px;
          border-radius: 11px;
        }

        .step-wrap:not(:last-child)::after {
          left: 25px;
        }

        .step-wrap:not(:last-child)::before {
          left: 21px;
        }

      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        .step-button {
          transition: none;
        }
      }
    </style>
    <style>
      .story-layout {
        display: grid;
        grid-template-columns: minmax(220px, 300px) minmax(0, 1160px);
        justify-content: center;
        gap: clamp(40px, 5vw, 80px);
        align-items: start;
      }

      .story-nav {
        position: sticky;
        top: 20px;
        max-height: calc(100vh - 40px);
        overflow-y: auto;
        padding: 8px 24px 8px 0;
        border-right: 1px solid var(--line);
        scrollbar-width: thin;
      }

      .story-nav-title {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .story-nav ol {
        display: grid;
        gap: 2px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .story-nav-link {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        gap: 8px;
        align-items: baseline;
        padding: 5px 0;
        color: #738196;
        text-decoration: none;
        transition: color 120ms ease;
      }

      .story-nav-link:hover {
        color: #b9c4d3;
      }

      .story-nav-link:focus-visible {
        border-radius: 4px;
        outline: 2px solid rgba(100, 168, 255, 0.6);
        outline-offset: 3px;
      }

      .story-nav-link.active {
        color: var(--text);
      }

      .story-nav-number {
        color: #526075;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        font-weight: 800;
      }

      .story-nav-link.active .story-nav-number {
        color: var(--blue);
      }

      .story-nav-text {
        font-size: 12px;
        font-weight: 650;
        line-height: 1.35;
      }

      .story {
        min-width: 0;
        padding-bottom: 32vh;
      }

      .story-step {
        padding: 30px 0 42px;
        scroll-margin-top: 20px;
      }

      .story-step:first-child {
        padding-top: 4px;
      }

      .story-step:last-child {
        padding-bottom: 30px;
      }

      .story-step h2 {
        max-width: 1160px;
        margin: 0 0 10px;
        font-size: 23px;
        line-height: 1.3;
        letter-spacing: -0.02em;
      }

      .story-prose {
        max-width: 1160px;
        margin: 0;
        color: #c5ceda;
        font-size: 16px;
        line-height: 1.72;
      }

      .story-sentence {
        display: block;
      }

      @media (max-width: 820px) {
        .page-shell {
          width: min(100% - 24px, 760px);
        }

        .story-layout {
          display: block;
        }

        .story-nav {
          top: 0;
          z-index: 10;
          max-height: none;
          margin: 0 -12px;
          padding: 10px 12px;
          overflow-x: auto;
          overflow-y: hidden;
          border-right: 0;
          border-bottom: 1px solid var(--line);
          background: rgba(8, 11, 17, 0.96);
          backdrop-filter: blur(12px);
        }

        .story-nav-title {
          display: none;
        }

        .story-nav ol {
          display: flex;
          width: max-content;
          gap: 16px;
        }

        .story-nav-link {
          display: block;
          padding: 4px 0;
        }

        .story-nav-text {
          display: none;
        }

        .story-nav-number {
          font-size: 12px;
        }

        .story-step {
          scroll-margin-top: 56px;
        }

        .story-step:first-child {
          padding-top: 24px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .story-nav-link {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <div class="story-layout">
        <nav class="story-nav" aria-label="Release steps">
          <p class="story-nav-title">Release steps</p>
          <ol id="story-nav-list"></ol>
        </nav>

        <article class="story" id="story" aria-label="Release process"></article>
      </div>
    </main>

    <script>
      const steps = [
        {
          phase: "Ready",
          title: "Make sure every PR is ready to merge",
          story:
            "Before sending a release request, make sure every PR is ready to merge. Required reviews must be complete, all checks must pass, and there must be no merge conflicts. Fix anything that is not ready first. The Coordinator checks each PR before accepting the request and checks the exact code again immediately before merging.",
          summary: "Keep unfinished work out of the Coordinator.",
          owner: "PR author, reviewers, and GitHub",
          happens:
            "People review the PR, and the normal GitHub checks run. The Release Coordinator does nothing yet.",
          proof:
            "The PR is approved, all checks pass, and the exact code version is known.",
          gap:
            "Define the exact required checks, review rules, deploy-unit metadata, and who may declare a PR ready in each repository.",
          failureLabel: "If not ready",
          failure:
            "Fix the PR and try again later."
        },
        {
          phase: "Submit",
          title: "Send the release request",
          story:
            "When all PRs are ready, send them to the Coordinator as one release request. The request says which PRs belong together, what must be deployed, and whether one deployment must finish before another—for example, backend before frontend. Normal PRs from the same project do not need an order. Sending the request does not accept it yet. After it is accepted and merged, it may be deployed together with other ready requests in one deployment batch.",
          summary: "One request names the PRs, deployment targets, and any required deployment order.",
          owner: "Release submission",
          happens:
            "The release request is sent to the Coordinator. It contains the exact PRs, which changes must happen first, and the affected services.",
          proof:
            "The Coordinator receives one complete request describing the intended release.",
          gap:
            "Finalize the API schema, maximum batch size, allowed dependency syntax, production-policy choices, and idempotency key rules.",
          failure:
            "A malformed or incomplete request is rejected before it is accepted. No merge, build, or deployment starts."
        },
        {
          phase: "Submit",
          title: "Check who sent the request",
          story:
            "The Coordinator checks who sent the request and whether they are allowed to submit it. If they are allowed, the request continues. If not, nothing is merged or deployed.",
          summary: "The system proves who is asking and what they are allowed to release.",
          owner: "Release Coordinator API",
          happens:
            "The API checks the requester identity, repository scope, environment permission, and production policy. It records the real requester rather than trusting a name supplied inside the request body.",
          proof:
            "An auditable identity and authorization decision are attached to the release request.",
          gap:
            "Choose the requester authentication methods, service identities, role model, secret rotation, and emergency-access process.",
          failure:
            "The API rejects the request. Nothing is added to the waiting list and no external workflow is called."
        },
        {
          phase: "Submit",
          title: "The request is accepted or rejected",
          story:
            "Before accepting the request, the Coordinator checks that every PR is open, approved, tested, and ready to merge. It also checks that all deployment targets exist and the requested order is possible. If every check passes, it saves the request, gives it an ID, and adds it to the list of requests waiting to merge. Otherwise, it rejects the request.",
          summary: "Only a valid, fully planned request is accepted and saved.",
          owner: "Release Coordinator using GitHub and its database",
          happens:
            "The Coordinator checks current PR heads, open state, target branches, approvals, required CI, mergeability, duplicate use, deployment targets, and required ordering. It saves the accepted request and exact plan in one durable record.",
          proof:
            "An accepted request ID retrieves the exact PR evidence and deployment plan after a restart. A rejected request is never added to the waiting list.",
          gap:
            "Finalize PR readiness rules, valid deployment targets, duplicate handling, request limits, database guarantees, and retry behaviour when GitHub cannot answer.",
          failure:
            "The request is rejected if any PR or deployment rule is invalid. The Coordinator returns an ID only after the accepted request and its plan are safely saved."
        },
        {
          phase: "Merge",
          title: "The request waits for its merge turn",
          story:
            "Once accepted, the request waits for a short turn to merge its PRs. Earlier accepted requests go first. The Coordinator starts the next request automatically when its turn arrives. This waiting line controls only merging, not building or deployment. Until its turn arrives, the request changes nothing.",
          summary: "Accepted requests receive short merge turns in order.",
          owner: "Coordinator queue",
          happens:
            "The request enters READY_TO_MERGE. Earlier accepted work keeps priority unless a recorded operator decision cancels, supersedes, or reorders it. PR development and review continue normally while the request waits.",
          proof:
            "The database shows one stable waiting position and why any earlier request is still ahead.",
          gap:
            "Define fair ordering, priority classes, maximum waiting time, cancellation authority, and whether emergency requests may overtake normal work.",
          failure:
            "A waiting or reservation timeout does not change GitHub. The request remains waiting or becomes NEEDS_HUMAN with the exact blocker recorded."
        },
        {
          phase: "Merge",
          title: "The repositories are reserved for this request",
          story:
            "When the request's turn arrives, the Coordinator briefly reserves every repository it needs. This stops two requests from merging into the same repository at the same time. GitHub still protects the main branch, and only the approved Coordinator app can perform these merges. If every required repository cannot be reserved, the Coordinator releases any partial reservations and waits without changing code.",
          summary: "Only one Coordinator worker may perform a repo's final merge operation.",
          owner: "Coordinator database plus GitHub repository rules",
          happens:
            "The worker transactionally claims leases for every affected repository in one canonical order. GitHub keeps main protected at all times; other actors cannot bypass it, and the narrowly permitted Coordinator GitHub App is the normal merge actor.",
          proof:
            "There is one active lease owner per repository and one auditable GitHub App identity for every merge.",
          gap:
            "Specify lease length, heartbeat and takeover rules, GitHub App permissions, branch protections, and the audited emergency-admin path.",
          failure:
            "If all required leases cannot be claimed, the worker releases any partial claims and waits. It performs no repository mutation."
        },
        {
          phase: "Merge",
          title: "The request's PRs are checked and merged",
          story:
            "While the repositories are reserved, the Coordinator checks the current main branches, the exact PR code, reviews, tests, and merge status. If everything passes, it immediately merges only those checked PR versions in the safe order. GitHub refuses the merge if a PR changes after the check. If a check fails, nothing is merged. If only part of a frontend and backend merge succeeds, the request stops and a human chooses the repair before it can join a deployment batch.",
          summary: "The checked PR versions are merged immediately, or nothing is merged.",
          owner: "Coordinator GitHub App and repository merge controls",
          happens:
            "While holding every required repository lease, the worker refreshes main and PR state, then calls GitHub's merge API with each expected PR head SHA. Protected main branches and the expected SHA prevent different code from being merged. Cross-repository results are recorded one item at a time.",
          proof:
            "The request stores the final checked state and GitHub's exact success or failure result for every planned PR.",
          gap:
            "Choose merge or squash strategy, exact GitHub App permissions, whether changed bases require a new request, and the repair process for partial cross-repository success.",
          failure:
            "Before the first merge, any failed check changes nothing. After a partial cross-repository merge, the request records exactly what changed and joins no deployment batch until a human chooses the repair."
        },
        {
          phase: "Batch",
          title: "The merged request joins the next deployment batch",
          story:
            "After every PR in the request is merged, the Coordinator records the result and adds the request to the next open deployment batch. It then releases the repository reservations so another request can take its merge turn and join the same batch. A request with an incomplete merge cannot join a batch.",
          summary: "Successfully merged requests collect in the next open deployment batch.",
          owner: "Release Coordinator",
          happens:
            "The Coordinator records the request ID, exact merge results, affected deployment targets, and required ordering in the open batch. It then releases every repository reservation held by that request.",
          proof:
            "The open batch lists every included request and the exact GitHub result for each of its PRs. No repository reservation remains after the request is recorded.",
          gap:
            "Define maximum batch size, maximum collection time, whether urgent requests may force an early cutoff, and safe recovery for a leaked repository reservation.",
          failure:
            "If the merged result cannot be safely recorded, the request does not join a batch and nothing is built or deployed from it. A human recovers the exact result from GitHub."
        },
        {
          phase: "Batch",
          title: "The deployment batch is closed and saved",
          story:
            "While another batch is moving through staging and production, successfully merged requests collect in the next open batch. When the current batch finishes in production, the Coordinator closes the next batch and saves its exact frontend and backend versions. If no deployment is running, the first ready batch can close immediately. A batch may also close early when it reaches its safety limit. Once closed, no more requests can join it. Later requests go into the following batch.",
          summary: "One fixed batch names every included request and the exact code to deploy.",
          owner: "Release Coordinator",
          happens:
            "The Coordinator atomically closes the open batch, captures the complete frontend and backend main SHAs, includes the union of required deployment targets and ordering rules, and opens a new empty batch for later requests.",
          proof:
            "One immutable batch manifest lists every included request, exact source version, deployment target, ordering rule, and batch ID.",
          gap:
            "Finalize the exact cutoff trigger, maximum batch size, manifest format, signing, retention, and what happens when the deployment lane is free but another request is still merging.",
          failure:
            "If the batch cannot be durably saved, no build or deployment begins. The merged code remains on main, and the exact batch must be recovered from the recorded request and GitHub evidence."
        },
        {
          phase: "Build",
          title: "The deployment batch is built once",
          story:
            "The Coordinator asks the frontend and backend repositories to build the exact code saved for the closed batch. Every output is linked to the batch and all requests inside it. The same outputs move through staging and production; the system never rebuilds from the newest main branch. If a build fails, staging stays unchanged. A temporary infrastructure problem may retry the same batch, but a code fix must enter a new request and a later batch.",
          summary: "Build once from the saved SHAs, then promote the same exact output.",
          owner: "Product repository workflows and trusted artifact storage",
          happens:
            "The Coordinator dispatches canonical frontend and backend builds with the batch ID and captured SHAs. Repositories keep their own build logic. Artifact digests, provenance, logs, and workflow run IDs are linked to the batch manifest and included request IDs.",
          proof:
            "Every deployable has a trusted immutable artifact digest bound to the saved source SHA. Environment-specific builds, if unavoidable, get separate digests from the same captured source.",
          gap:
            "Confirm artifact storage, signing and provenance, reproducibility expectations, workflow callback authentication, retention, and which deployables support build-once promotion.",
          failure:
            "The batch stops before staging. Main contains the merged code, but environments remain unchanged. A code fix enters a new request and later batch; an infrastructure retry uses the same saved batch manifest."
        },
        {
          phase: "Staging",
          title: "The deployment batch waits for staging",
          story:
            "Built batches wait for an exclusive turn in the shared staging environment. Only one batch may change and test staging at a time, so different versions cannot become mixed or accidentally move backward. When this batch reaches the front of the line, the Coordinator records that it owns staging. Until then, no staging deployment starts.",
          summary: "Shared staging accepts only one changing and validating batch at a time.",
          owner: "Coordinator staging lane",
          happens:
            "Built batches wait independently from request merge turns. A batch may claim staging only after required earlier batches are terminal, so staging cannot accidentally move backward or mix two manifests.",
          proof:
            "One durable staging reservation names the batch, current known-good manifest, issued operations, and expiry or heartbeat state.",
          gap:
            "Define whether all services share one staging lane, reservation recovery, maximum validation time, and the exact replacement rules for obsolete batches.",
          failure:
            "The batch waits. It does not dispatch deployment while another owner is changing or checking staging."
        },
        {
          phase: "Staging",
          title: "The batch's backend changes are deployed to staging",
          story:
            "In staging, the Coordinator deploys the combined backend services affected by all requests in the batch and follows the saved order. A required service must finish and report the correct version before a service that depends on it can start. Independent services may deploy together when that is known to be safe. A temporary infrastructure problem may retry the same built output. A code or health problem stops the remaining services, may restore the last good staging version, and asks a human for help.",
          summary: "Affected backend units follow a saved DAG; independent units may run together.",
          owner: "Backend canonical deployment workflows",
          happens:

          gap:
            "Inventory every deployable, dependency edge, runtime identity endpoint, timeout, safe concurrency rule, and restoration procedure.",

        },
        {

          title: "The batch's frontend changes are deployed to staging",
          story:
            "After the required backend services are running the correct versions, the Coordinator deploys the frontend output saved for the batch. It does not rebuild from the latest main branch or choose newer code. This step finishes only when the frontend reports the expected version and can safely use the backend. A temporary infrastructure problem may retry the same output. A real product problem restores the last good frontend and blocks the batch from moving forward.",
          summary: "The saved frontend artifact moves only after its backend contract is present.",
          owner: "Frontend canonical deployment workflow",
          happens:
            "Once required backend runtimes prove the expected batch versions, the Coordinator dispatches the frontend staging deployment. It does not rebuild from newest main or substitute a newer PR head.",

          gap:
            "Define the frontend runtime identity contract, CDN/cache invalidation proof, environment configuration handling, and known-good restoration process.",

          owner: "Runtime proof endpoints and manifest-bound E2E",
          happens:

        {

        {

        {

      const storyNavRoot = document.querySelector("#story-nav-list");
      const storyRoot = document.querySelector("#story");
      const storyNav = document.querySelector(".story-nav");
      const navLinks = [];
      const storySections = [];
      let activeIndex = readInitialStep();

      function readInitialStep() {
        const rawStep = new URLSearchParams(window.location.search).get("step");
        const requested = Number.parseInt(rawStep || "1", 10);
        return Number.isInteger(requested) && requested >= 1 && requested <= steps.length
          ? requested - 1
          : 0;
      }

      function storyMarkup(step, index) {
        return `
          <h2 id="story-step-title-${index + 1}">${step.title}</h2>
          <p class="story-prose">${storySentenceMarkup(step.story)}</p>
        `;
      }

      function storySentenceMarkup(story) {
        const sentences = story.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [story];
        return sentences
          .map((sentence) => `<span class="story-sentence">${sentence.trim()}</span>`)
          .join("");
      }

      function setActiveStep(index, options = {}) {
        const nextIndex = Math.max(0, Math.min(steps.length - 1, index));
        activeIndex = nextIndex;

        navLinks.forEach((link, linkIndex) => {
          const active = linkIndex === activeIndex;
          link.classList.toggle("active", active);
          if (active) {
            link.setAttribute("aria-current", "step");
          } else {
            link.removeAttribute("aria-current");
          }
        });

        if (options.updateUrl !== false) {
          const url = new URL(window.location.href);
          url.searchParams.set("step", String(activeIndex + 1));
          url.hash = "";
          window.history.replaceState({}, "", url);
        }

        const activeLink = navLinks[activeIndex];
        if (window.matchMedia("(max-width: 820px)").matches) {
          storyNav.scrollTo({
            left: activeLink.offsetLeft - storyNav.clientWidth / 2 + activeLink.clientWidth / 2,
            behavior: "smooth"
          });
        } else {
          const linkTop = activeLink.offsetTop;
          const linkBottom = linkTop + activeLink.offsetHeight;
          const visibleTop = storyNav.scrollTop;
          const visibleBottom = visibleTop + storyNav.clientHeight;

          if (linkTop < visibleTop || linkBottom > visibleBottom) {
            storyNav.scrollTo({
              top: Math.max(0, linkTop - storyNav.clientHeight / 2),
              behavior: "smooth"
            });
          }
        }
      }

      function scrollToStep(index) {
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        storySections[index].scrollIntoView({
          block: "start",
          behavior: reducedMotion ? "auto" : "smooth"
        });
        setActiveStep(index);
      }

      steps.forEach((step, index) => {
        const navItem = document.createElement("li");
        const navLink = document.createElement("a");
        navLink.className = "story-nav-link";
        navLink.href = `#step-${index + 1}`;
        navLink.innerHTML = `
          <span class="story-nav-number">${String(index + 1).padStart(2, "0")}</span>
          <span class="story-nav-text">${step.title}</span>
        `;
        navLink.addEventListener("click", (event) => {
          event.preventDefault();
          scrollToStep(index);
        });

        const section = document.createElement("section");
        section.className = "story-step";
        section.id = `step-${index + 1}`;
        section.setAttribute("aria-labelledby", `story-step-title-${index + 1}`);
        section.innerHTML = storyMarkup(step, index);

        navItem.append(navLink);
        storyNavRoot.append(navItem);
        storyRoot.append(section);
        navLinks.push(navLink);
        storySections.push(section);
      });

      function updateActiveStepFromScroll() {
        const readingLine = Math.min(window.innerHeight * 0.3, 260);
        let nextIndex = 0;

        storySections.forEach((section, index) => {
          if (section.getBoundingClientRect().top <= readingLine) {
            nextIndex = index;
          }
        });

        const atPageEnd = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 2;
        if (atPageEnd) {
          nextIndex = storySections.length - 1;
        }

        if (nextIndex !== activeIndex) {
          setActiveStep(nextIndex);
        }
      }

      let scrollFrame = 0;
      function queueActiveStepUpdate() {
        if (scrollFrame) {
          return;
        }

        scrollFrame = window.requestAnimationFrame(() => {
          scrollFrame = 0;
          updateActiveStepFromScroll();
        });
      }

      window.addEventListener("scroll", queueActiveStepUpdate, { passive: true });
      window.addEventListener("resize", queueActiveStepUpdate);

      setActiveStep(activeIndex);
      if (activeIndex > 0) {
        window.requestAnimationFrame(() => {
          storySections[activeIndex].scrollIntoView({ block: "start" });
        });
      } else {
        window.requestAnimationFrame(updateActiveStepFromScroll);
      }
    </script>
  </body>
