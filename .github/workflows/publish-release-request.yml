name: Release request CLI

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Publish release-request {0}', inputs.version)
      || 'Check release request CLI' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact release-request package version to publish
        required: true
        type: string
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check package
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run package tests
        run: npm test --workspace=@6529-collections/release-request

      - name: Check package contents without publishing
        run: npm pack --dry-run --ignore-scripts --workspace=@6529-collections/release-request

  publish:
    if: github.event_name == 'workflow_dispatch'
    name: Publish package
    needs: check
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out protected main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check branch and package version
        shell: bash
        run: |
          set -euo pipefail

          npm_version="$(npm --version)"
          package_version="$(node --print "require('./packages/release-request/package.json').version")"
          expected_tag="release-request-v${package_version}"

          node --input-type=module --eval '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (
              !Number.isInteger(major) ||
              major < 11 ||
              (major === 11 && minor < 5) ||
              (major === 11 && minor === 5 && patch < 1)
            ) {
              throw new Error(`Trusted Publishing requires npm 11.5.1 or newer; received ${process.argv[1]}.`);
            }
          ' "${npm_version}"

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Publishing is allowed only from main; received ${GITHUB_REF}." >&2
            exit 1
          fi

          if [[ "${{ inputs.version }}" != "${package_version}" ]]; then
            echo "Requested version ${{ inputs.version }} does not match package version ${package_version}." >&2
            exit 1
          fi

          if ! git show-ref --verify --quiet "refs/tags/${expected_tag}"; then
            echo "Required source tag ${expected_tag} does not exist." >&2
            exit 1
          fi

          tag_commit="$(git rev-list --max-count=1 "${expected_tag}")"
          if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
            echo "Tag ${expected_tag} points to ${tag_commit}, not ${GITHUB_SHA}." >&2
            exit 1
          fi

      - name: Check package contents without publishing
        run: npm pack --dry-run --ignore-scripts --workspace=@6529-collections/release-request

      - name: Create the package archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail

          npm pack --ignore-scripts --json --workspace=@6529-collections/release-request > npm-pack.json
          cat npm-pack.json
          node --input-type=module --eval '
            import { appendFileSync, readFileSync } from "node:fs";

            const [archive] = JSON.parse(readFileSync("npm-pack.json", "utf8"));
            if (!archive?.filename) {
              throw new Error("npm pack did not report an archive filename.");
            }
            appendFileSync(process.env.GITHUB_OUTPUT, `package-file=${archive.filename}\n`);
          '
          sha256sum "$(node --input-type=module --eval '
            import { readFileSync } from "node:fs";
            const [archive] = JSON.parse(readFileSync("npm-pack.json", "utf8"));
            process.stdout.write(archive.filename);
          ')"

      - name: Publish the inspected archive
        run: npm publish "${{ steps.archive.outputs.package-file }}" --access public --ignore-scripts --provenance
