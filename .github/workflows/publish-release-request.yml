name: Release request CLI

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Publish release-request {0}', inputs.version)
      || 'Check release request CLI' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact release-request package version to publish
        required: true
        type: string
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Repository checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check Coordinator code and package
        run: npm run check

  check:
    name: Check package
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every Node version to pass
        env:
          CHECK_RESULT: ${{ needs.verify.result }}
        run: test "$CHECK_RESULT" = success

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Publish package
    needs: check
    runs-on: ubuntu-latest
    # This external environment rule is the main-only publication gate.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out protected main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check branch and package version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          npm_version="$(npm --version)"
          package_version="$(node --print "require('./packages/release-request/package.json').version")"

          node --input-type=module --eval '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (
              !Number.isInteger(major) ||
              !Number.isInteger(minor) ||
              !Number.isInteger(patch) ||
              major < 11 ||
              (major === 11 && minor < 5) ||
              (major === 11 && minor === 5 && patch < 1)
            ) {
              throw new Error(`Trusted Publishing requires npm 11.5.1 or newer; received ${process.argv[1]}.`);
            }
          ' "${npm_version}"

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Publishing is allowed only from main; received ${GITHUB_REF}." >&2
            exit 1
          fi

          if [[ "${REQUESTED_VERSION}" != "${package_version}" ]]; then
            echo "Requested version ${REQUESTED_VERSION} does not match package version ${package_version}." >&2
            exit 1
          fi

      - name: Check package contents without publishing
        run: npm pack --dry-run --ignore-scripts --workspace=@6529-collections/release-request

      - name: Create the package archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail

          npm pack --ignore-scripts --json --workspace=@6529-collections/release-request > npm-pack.json
          cat npm-pack.json
          node --input-type=module --eval '
            import { createHash } from "node:crypto";
            import { appendFileSync, readFileSync } from "node:fs";

            const [archive] = JSON.parse(readFileSync("npm-pack.json", "utf8"));
            if (!archive?.filename) {
              throw new Error("npm pack did not report an archive filename.");
            }
            const sha256 = createHash("sha256")
              .update(readFileSync(archive.filename))
              .digest("hex");
            appendFileSync(process.env.GITHUB_OUTPUT, `package-file=${archive.filename}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `sha256=${sha256}\n`);
            console.log(`${sha256}  ${archive.filename}`);
          '

      - name: Publish the inspected archive
        shell: bash
        env:
          PACKAGE_FILE: ${{ steps.archive.outputs.package-file }}
          PACKAGE_SHA256: ${{ steps.archive.outputs.sha256 }}
        run: |
          set -euo pipefail

          actual_sha256="$(sha256sum "${PACKAGE_FILE}" | cut -d ' ' -f 1)"
          if [[ "${actual_sha256}" != "${PACKAGE_SHA256}" ]]; then
            echo "Package archive changed after inspection." >&2
            exit 1
          fi

          npm publish "./${PACKAGE_FILE}" --access public --ignore-scripts --provenance
