name: Publish release request CLI

on:
  workflow_dispatch:
  push:
    tags:
      - "release-request-v*"

permissions:
  contents: read

jobs:
  check:
    name: Check package
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run package tests
        run: npm test --workspace=@6529-collections/release-request

      - name: Check package contents without publishing
        run: npm pack --dry-run --workspace=@6529-collections/release-request

  publish:
    name: Publish package
    if: startsWith(github.ref, 'refs/tags/release-request-v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js for GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@6529-collections"

      - name: Install dependencies
        run: npm ci

      - name: Confirm that the tag matches the package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./packages/release-request/package.json').version")"
          expected_tag="release-request-v${package_version}"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Expected tag $expected_tag, received $RELEASE_TAG."
            exit 1
          fi

      - name: Publish to GitHub Packages
        run: npm publish --workspace=@6529-collections/release-request
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
