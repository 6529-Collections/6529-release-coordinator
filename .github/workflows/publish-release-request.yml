name: Check release request CLI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check package
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run package tests
        run: npm test --workspace=@6529-collections/release-request

      - name: Check package contents without publishing
        run: npm pack --dry-run --workspace=@6529-collections/release-request
