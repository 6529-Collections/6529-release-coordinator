name: Submit release request

run-name: Release request ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Release request ID used to identify this workflow run
        required: true
        type: string
      request_json:
        description: Complete release-request JSON created by the CLI
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: release-request-inbox-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  validate-and-save:
    name: Validate and save request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate and save the release request
        env:
          RELEASE_COORDINATOR_PROFILE: real
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ inputs.request_id }}
          REQUEST_JSON: ${{ inputs.request_json }}
        run: node apps/coordinator/bin/save-inbox-request.mjs
