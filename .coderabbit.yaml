# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: >-
  Use plain English. Explain concrete failures and missing tests. Separate
  confirmed findings from uncertainty and avoid unrelated redesigns.
reviews:
  profile: chill
  request_changes_workflow: false
  review_status: true
  review_details: true
  fail_commit_status: true
  high_level_summary_in_walkthrough: true
  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    ignore_title_keywords: []
    ignore_usernames: []
    labels: []
